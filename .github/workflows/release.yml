name: Build BoreHook CLI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile bore/cli.py --name bore

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bore-${{ matrix.os }}
          path: |
            dist/bore
            dist/bore.exe