name: Release BoreHook CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: bore-linux
            executable: dist/bore

          - os: windows-latest
            artifact: bore-windows
            executable: dist/bore.exe

          - os: macos-latest
            artifact: bore-macos
            executable: dist/bore

    runs-on: ${{ matrix.os }}

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile bore/cli.py --name bore

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.executable }}

  release:

    needs: build

    runs-on: ubuntu-latest

    steps:

      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bore-linux/bore
            bore-windows/bore.exe
            bore-macos/bore