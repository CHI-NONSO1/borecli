name: Release BoreHook CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            executable: bore
            archive: bore-linux.tar.gz

          - os: macos-latest
            executable: bore
            archive: bore-macos.tar.gz

          - os: windows-latest
            executable: bore.exe
            archive: bore-windows.zip

    runs-on: ${{ matrix.os }}

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile bore/cli.py --name bore

      #
      # Create release folder
      #

      - name: Prepare package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir package
          cp dist/${{ matrix.executable }} package/
          cp README.md package/
          cp LICENSE package/

      - name: Prepare package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item package -ItemType Directory

          Copy-Item dist\bore.exe package\
          Copy-Item README.md package\
          Copy-Item LICENSE package\

      #
      # Compress
      #

      - name: Archive Linux/macOS
        if: runner.os != 'Windows'
        run: |
          tar -czf dist/${{ matrix.archive }} -C package .

      - name: Archive Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path package\* `
            -DestinationPath dist\bore-windows.zip

      #
      # Upload
      #

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}

  release:

    needs: build

    runs-on: ubuntu-latest

    steps:

      - uses: actions/download-artifact@v4

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bore-linux.tar.gz/bore-linux.tar.gz
            bore-macos.tar.gz/bore-macos.tar.gz
            bore-windows.zip/bore-windows.zip