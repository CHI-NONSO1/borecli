name: Release BoreHook CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            executable: bore

          - os: macos-latest
            platform: macos
            executable: bore

          - os: windows-latest
            platform: windows
            executable: bore.exe

    runs-on: ${{ matrix.os }}

    env:
      VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller --clean --onefile --name bore bore/cli.py
      #
      # Create release directory
      #

      - name: Prepare package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          PACKAGE="bore-${VERSION}-${{ matrix.platform }}"

          mkdir "$PACKAGE"

          cp "dist/${{ matrix.executable }}" "$PACKAGE/"
          cp README.md "$PACKAGE/"
          cp LICENSE "$PACKAGE/"

          echo "${VERSION}" > "$PACKAGE/VERSION"

      - name: Prepare package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "bore-$env:VERSION-${{ matrix.platform }}"

          New-Item $package -ItemType Directory

          Copy-Item dist\bore.exe $package\
          Copy-Item README.md $package\
          Copy-Item LICENSE $package\

          Set-Content `
            -Path "$package\VERSION" `
            -Value $env:VERSION

      #
      # Archive
      #

      - name: Archive Linux/macOS
        if: runner.os != 'Windows'
        run: |
          PACKAGE="bore-${VERSION}-${{ matrix.platform }}"

          tar -czf \
            "dist/${PACKAGE}.tar.gz" \
            "$PACKAGE"

      - name: Archive Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "bore-$env:VERSION-${{ matrix.platform }}"

          Compress-Archive `
            -Path "$package" `
            -DestinationPath "dist\$package.zip"

      #
      # Upload artifact
      #

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bore-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  release:
    name: Publish GitHub Release

    needs: build

    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4

      - name: Display downloaded files
        run: find .

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false

          files: |
            **/*.zip
            **/*.tar.gz